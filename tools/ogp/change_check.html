<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:#F4F7FB;color:#1F2A36;position:relative;
  }
  .bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:#2F6EA5}
  .wrap{position:absolute;left:84px;top:64px;width:600px;bottom:60px}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:68px;height:68px;border-radius:16px}
  .brand .name{font-size:30px;font-weight:700;color:#2F3B48;letter-spacing:.01em}
  .brand span{white-space:nowrap}
  .brand .old{font-size:19px;font-weight:600;color:#6B7A89;margin-left:-8px}
  .brand .pill{font-size:17px;font-weight:600;color:#2F6EA5;border:2px solid #9DBCD9;
    border-radius:999px;padding:3px 14px;margin-left:4px}
  .tag{display:inline-block;margin-top:40px;font-size:22px;font-weight:700;color:#fff;
    background:#2F6EA5;border-radius:8px;padding:5px 16px;letter-spacing:.06em}
  h1{margin-top:16px;font-size:66px;line-height:1.24;font-weight:800;letter-spacing:.01em}
  .sub{margin-top:14px;font-size:34px;font-weight:700;color:#2F6EA5}
  .hook{position:absolute;left:0;bottom:0;font-size:25px;font-weight:600;color:#2F3B48;
    background:#fff;border:2px solid #DCE6F0;border-radius:14px;padding:14px 22px}
  .visual{position:absolute;right:28px;top:108px;width:492px;height:410px}
</style>
</head>
<body>
  <div class="bar"></div>
  <img class="visual" src="../../docs/guide/change-check/hero.svg" alt="">
  <div class="wrap">
    <div class="brand">
      <img src="../../docs/images/apple-touch-icon.png" alt="">
      <span class="name">施主手帳</span>
      <span class="old">（旧名：ICHIJO施主手帳）</span>
    </div>
    <div class="tag">解説記事</div>
    <h1>サイレント<br>フィリピンとは？</h1>
    <div class="sub">図面の変更点を確認する方法</div>
    <div class="hook">最終仕様確認だけでなく、どの版でも起こります</div>
  </div>
</body>
</html>
