<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:#F4F7FB;color:#1F2A36;position:relative;
  }
  .bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:#2F6EA5}
  .wrap{position:absolute;left:84px;top:64px;right:64px;bottom:60px}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:68px;height:68px;border-radius:16px}
  .brand .name{font-size:30px;font-weight:700;color:#2F3B48;letter-spacing:.01em}
  .brand .old{font-size:19px;font-weight:600;color:#6B7A89;margin-left:-8px}
  .brand .pill{font-size:17px;font-weight:600;color:#2F6EA5;border:2px solid #9DBCD9;
    border-radius:999px;padding:3px 14px;margin-left:4px}
  .tag{display:inline-block;margin-top:44px;font-size:22px;font-weight:700;color:#fff;
    background:#2F6EA5;border-radius:8px;padding:5px 16px;letter-spacing:.06em}
  h1{margin-top:18px;font-size:64px;line-height:1.28;font-weight:800;letter-spacing:.01em}
  .date{margin-top:14px;font-size:34px;font-weight:700;color:#2F6EA5}
  .points{position:absolute;left:0;bottom:0;display:flex;gap:18px}
  .pt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #DCE6F0;
    border-radius:14px;padding:14px 22px;font-size:25px;font-weight:600;color:#2F3B48}
  .pt svg{flex:none}
  .swap{position:absolute;right:30px;top:150px;width:250px;height:250px;border-radius:50%;
    background:#E3EEF8;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="swap">
    <svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#2F6EA5"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h14"/><path d="M14 4l4 4-4 4"/>
      <path d="M20 16H6"/><path d="M10 12l-4 4 4 4"/>
    </svg>
  </div>
  <div class="wrap">
    <div class="brand">
      <img src="../../docs/images/apple-touch-icon.png" alt="">
      <span class="name">施主手帳</span>
      <span class="old">（旧名：ICHIJO施主手帳）</span>
    </div>
    <div class="tag">お知らせ</div>
    <h1>無料版の図面番号の<br>入れ替えについて</h1>
    <div class="date">11月1日から</div>
    <div class="points">
      <div class="pt">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F6EA5" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        今ある図面番号とデータは消えません
      </div>
      <div class="pt">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F6EA5" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        図面チェックなどの機能は無料のまま
      </div>
    </div>
  </div>
</body>
</html>
